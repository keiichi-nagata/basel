name: cars-monthly

# 毎月8日 06:00 JST（= 7日 21:00 UTC）。自販連・全軽自協のサイトから前月の車名別
# エクセルを取得して総合TOP5を組み立て、レビュー用PRを開く。取得に失敗した場合は
# data/inputs/YYYY-MM.json（手動貼付）へフォールバック。両方無ければ step が失敗し
# PRは開かない。手動実行も可（Actions → Run workflow）。
on:
  schedule:
    - cron: "0 21 7 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r dev/2-cars/pipeline/requirements.txt

      - name: Build TOP5 draft
        id: build
        run: |
          MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          if python dev/2-cars/pipeline/collect.py "$MONTH"; then
            echo "built=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::collect.py が台数データを取得できませんでした（自販連/全軽自協のサイト変更の可能性）。dev/2-cars/data/inputs/$MONTH.json に手動で貼って再実行してください"
            echo "built=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.build.outputs.built == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: cars/auto-build
          base: main
          title: "2-cars: ${{ steps.build.outputs.month }} TOP5 下書き"
          commit-message: "chore(2-cars): ${{ steps.build.outputs.month }} データ組み立て"
          add-paths: |
            dev/2-cars/data/**
            dev/2-cars/drafts/**
          body: |
            自販連・全軽自協の入力から総合TOP5を組み立てた下書きです。マージ前に:
            1. `car-column-writer` で「各車の理由／共通構造／働き方・投資への示唆」を執筆
            2. `【要確認】` `【価格要確認】` を解消（数字・価格は一次PDFと照合）
            3. 「自販連・全軽自協発表の統計をもとに集計」の注記を確認
            4. note へ公開 → マガジン追加 → `published/${{ steps.build.outputs.month }}.md` 記録
